# GestorLegal — despliegue todo-en-uno para EasyPanel (app Next.js + Postgres)
# EasyPanel: crear servicio tipo "Compose" apuntando a este archivo.
# Las variables se definen en el .env del proyecto (ver .env.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gestorlegal_data:/var/lib/postgresql/data
      # Crea las tablas + seed solo en el PRIMER arranque (cuando el volumen está vacío)
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Respaldo diario de la BD al volumen gestorlegal_backups, conserva 14 días.
  # ponytail: bucle sh en vez de cron; si el contenedor reinicia se reinicia el ciclo.
  # Respaldo al arrancar y luego todos los días a las 20:00 hora del despacho.
  # El sleep se calcula contra el próximo 20:00 en vez de dormir 86400s fijos: así la hora no
  # se va corriendo con cada redespliegue. Sin cron ni imagen extra.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: America/Mexico_City
    volumes:
      - gestorlegal_backups:/backups
    command: >
      sh -c 'while true; do
      pg_dump | gzip > /backups/gestorlegal_$$(date +%F_%H%M).sql.gz &&
      find /backups -name "*.sql.gz" -mtime +14 -delete;
      ahora=$$(date +%s);
      proximo=$$(date -d "today 20:00" +%s);
      [ $$ahora -ge $$proximo ] && proximo=$$(date -d "tomorrow 20:00" +%s);
      sleep $$((proximo - ahora));
      done'

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BUILDTIME: ${BUILDTIME:-1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      N8N_API_KEY: ${N8N_API_KEY}
      # Webhook de n8n que crea el evento en Google Calendar al agendar una cita.
      # Si faltan, crearEventoCalendar() devuelve null sin ruido y la cita se
      # guarda sin evento: definirlas en el .env NO basta, tienen que mapearse aquí.
      N8N_CALENDAR_WEBHOOK_URL: ${N8N_CALENDAR_WEBHOOK_URL:-}
      N8N_CALENDAR_WEBHOOK_KEY: ${N8N_CALENDAR_WEBHOOK_KEY:-}
      # Admin inicial: el seed lo crea en el primer arranque (idempotente).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
    expose:
      - "3000"
    volumes:
      - gestorlegal_uploads:/app/uploads

volumes:
  gestorlegal_data:
  gestorlegal_uploads:
  gestorlegal_backups:
